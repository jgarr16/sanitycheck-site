    <linearGradient xlink:href="#T-BRIGHT-MID"   id="r5"  x1="188.1" x2="188.1" y1="87.62" y2="133.6" gradientUnits="userSpaceOnUse"/>
    <linearGradient xlink:href="#T-BRIGHT-MID"   id="r6"  x1="208.1" x2="208.1" y1="96.01" y2="112.7" gradientUnits="userSpaceOnUse"/>

