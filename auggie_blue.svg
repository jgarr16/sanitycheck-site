<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="250"
   height="250"
   fill="none"
   viewBox="0 0 250 250"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:xlink="http://www.w3.org/1999/xlink">

  <desc>
    AUGGIE COLOR THEME
    To recolor everything: replace the stop-color values in the 7 T- gradients below.
    Each gradient has a comment showing the matching value for every available theme.
    Just find your theme column and paste the hex code for each stop — nothing else to touch.
  </desc>

  <defs>

    <!--
    =============================================================================
      THEME COLOR TABLE
      To switch themes: for each of the 7 gradients below, copy the hex value
      from your chosen theme column into stop-color="..."

      STOP        RED      ORANGE   YELLOW   GREEN    TEAL     BLUE     INDIGO   VIOLET   PINK     SLATE
      ========    =======  =======  =======  =======  =======  =======  =======  =======  =======  =======
      BRIGHT      #2E7FD0  #F47C20  #F0C010  #3DBA5F  #20B2A8  #2E7FD0  #5B6FD6  #7B3FA0  #E03E7A  #6A8AA8
      MID         #1560AA  #D95E00  #C89B00  #239444  #0E8F86  #1560AA  #3D4FB8  #5A2880  #C0215D  #4A6A88
      DEEP        #0C4280  #A84200  #9A7400  #146B2F  #086860  #0C4280  #28368A  #3D1860  #901042  #304E68
      DARK        #072C57  #752D00  #6B5000  #0A481E  #044640  #072C57  #172260  #2A0D45  #62082C  #1E3448
      SHADOW      #021428  #401800  #3A2A00  #03220D  #012220  #021428  #090E30  #150525  #320014  #0A1820
      =============================================================================
    -->

    <!-- T-VIVID-DEEP : arrow tip highlight → deepest shadow (upper body main fill) -->
    <linearGradient id="T-VIVID-DEEP">
      <stop offset="0" stop-color="#2E7FD0"/>
      <!--                          RED      ORANGE   YELLOW   GREEN    TEAL     BLUE     INDIGO   VIOLET   PINK     SLATE   -->
      <!--  offset="0" BRIGHT:      #2E7FD0  #F47C20  #F0C010  #3DBA5F  #20B2A8  #2E7FD0  #5B6FD6  #7B3FA0  #E03E7A  #6A8AA8 -->
      <stop offset="1" stop-color="#021428"/>
      <!--  offset="1" SHADOW:      #021428  #401800  #3A2A00  #03220D  #012220  #021428  #090E30  #150525  #320014  #0A1820 -->
    </linearGradient>

    <!-- T-VIVID-DARK : bright highlight → dark (main large body panels) -->
    <linearGradient id="T-VIVID-DARK">
      <stop offset="0" stop-color="#2E7FD0"/>
      <!--                          RED      ORANGE   YELLOW   GREEN    TEAL     BLUE     INDIGO   VIOLET   PINK     SLATE   -->
      <!--  offset="0" BRIGHT:      #2E7FD0  #F47C20  #F0C010  #3DBA5F  #20B2A8  #2E7FD0  #5B6FD6  #7B3FA0  #E03E7A  #6A8AA8 -->
      <stop offset="1" stop-color="#072C57"/>
      <!--  offset="1" DARK:        #072C57  #752D00  #6B5000  #0A481E  #044640  #072C57  #172260  #2A0D45  #62082C  #1E3448 -->
    </linearGradient>

    <!-- T-BRIGHT-MID : highlight → mid-tone (arrow tip details, small accents) -->
    <linearGradient id="T-BRIGHT-MID">
      <stop offset="0" stop-color="#2E7FD0"/>
      <!--                          RED      ORANGE   YELLOW   GREEN    TEAL     BLUE     INDIGO   VIOLET   PINK     SLATE   -->
      <!--  offset="0" BRIGHT:      #2E7FD0  #F47C20  #F0C010  #3DBA5F  #20B2A8  #2E7FD0  #5B6FD6  #7B3FA0  #E03E7A  #6A8AA8 -->
      <stop offset="1" stop-color="#1560AA"/>
      <!--  offset="1" MID:         #1560AA  #D95E00  #C89B00  #239444  #0E8F86  #1560AA  #3D4FB8  #5A2880  #C0215D  #4A6A88 -->
    </linearGradient>

    <!-- T-MID-BRIGHT : mid-tone → highlight (reversed accent details) -->
    <linearGradient id="T-MID-BRIGHT">
      <stop offset="0" stop-color="#1560AA"/>
      <!--                          RED      ORANGE   YELLOW   GREEN    TEAL     BLUE     INDIGO   VIOLET   PINK     SLATE   -->
      <!--  offset="0" MID:         #1560AA  #D95E00  #C89B00  #239444  #0E8F86  #1560AA  #3D4FB8  #5A2880  #C0215D  #4A6A88 -->
      <stop offset="1" stop-color="#2E7FD0"/>
      <!--  offset="1" BRIGHT:      #2E7FD0  #F47C20  #F0C010  #3DBA5F  #20B2A8  #2E7FD0  #5B6FD6  #7B3FA0  #E03E7A  #6A8AA8 -->
    </linearGradient>

    <!-- T-MID-DARK : mid-tone → dark (lower mid fills) -->
