      <stop offset="1" stop-color="#021428"/>
      <!--  offset="1" SHADOW:      #021428  #401800  #3A2A00  #03220D  #012220  #021428  #090E30  #150525  #320014  #0A1820 -->
    </linearGradient>

    <!-- T-ARROW-INNER : arrow interior accent — slightly lighter/warmer to stand out -->
