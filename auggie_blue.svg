      <!--  offset="1" DARK:        #072C57  #752D00  #6B5000  #0A481E  #044640  #072C57  #172260  #2A0D45  #62082C  #1E3448 -->
    </linearGradient>

    <!-- T-DEEP-DARK : deep mid → dark (transitional fills) -->
