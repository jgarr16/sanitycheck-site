      <stop offset="0" stop-color="#0C4280"/>
      <!--                          RED      ORANGE   YELLOW   GREEN    TEAL     BLUE     INDIGO   VIOLET   PINK     SLATE   -->
      <!--  offset="0" DEEP:        #0C4280  #A84200  #9A7400  #146B2F  #086860  #0C4280  #28368A  #3D1860  #901042  #304E68 -->
