    <linearGradient xlink:href="#T-VIVID-DARK"   id="r26" x1="130.8" x2="130.8" y1="138.7" y2="161.1" gradientUnits="userSpaceOnUse"/>
    <linearGradient xlink:href="#T-MID-DARK"     id="r27" x1="51.66" x2="51.66" y1="201.2" y2="230"   gradientUnits="userSpaceOnUse"/>

